# Standalone stack for developing and benchmarking the gateway.
# P1/P2/P3 include the gateway service in their own compose files (build: ../llm-gateway).
services:
  llm-gateway:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on: [redis]
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach Ollama running natively on Windows
    mem_limit: 700m   # semantic cache + guardrails ONNX models (v2)

  redis:
    image: redis:8                     # Redis 8: includes the query engine (vector search) — verify in M4
    # AOF keeps the budget across restarts; volatile-lfu evicts only keys with a TTL (cache), never budget keys (ADR-0004).
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lfu"]
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    mem_limit: 200m

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["obs"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/admin.key:/etc/prometheus/admin.key:ro   # raw admin key, git-ignored
    ports: ["9090:9090"]
    mem_limit: 300m

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["obs"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    ports: ["3000:3000"]
    mem_limit: 200m

  jaeger:
    image: jaegertracing/all-in-one:1.62.0   # gateway exports OTLP/HTTP here when GW_OTEL_ENDPOINT=http://jaeger:4318
    profiles: ["obs"]
    ports: ["16686:16686", "4317:4317", "4318:4318"]
    mem_limit: 200m

volumes:
  redis-data:
